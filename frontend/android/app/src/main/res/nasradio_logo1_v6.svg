<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="towerGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0088ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glowMain5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="90" fill="#0a0e27"/>
  <rect x="16" y="16" width="480" height="480" rx="90" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.4"/>
  
  <!-- Slim lattice radio tower - shifted down 30px -->
  <g filter="url(#glowMain5)">
    <!-- Main vertical pole -->
    <rect x="250" y="100" width="12" height="230" fill="url(#towerGrad5)" rx="2"/>
    
    <!-- Antenna tip -->
    <line x1="256" y1="100" x2="256" y2="70" stroke="url(#towerGrad5)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="62" r="10" fill="#00ffff"/>
    
    <!-- Horizontal cross beams - getting wider as they go down -->
    <rect x="220" y="130" width="72" height="8" fill="url(#towerGrad5)" rx="2"/>
    <rect x="205" y="185" width="102" height="8" fill="url(#towerGrad5)" rx="2"/>
    <rect x="190" y="240" width="132" height="8" fill="url(#towerGrad5)" rx="2"/>
    <rect x="175" y="295" width="162" height="8" fill="url(#towerGrad5)" rx="2"/>
    
    <!-- Left tower leg -->
    <line x1="220" y1="134" x2="175" y2="330" stroke="url(#towerGrad5)" stroke-width="6"/>
    
    <!-- Right tower leg -->
    <line x1="292" y1="134" x2="337" y2="330" stroke="url(#towerGrad5)" stroke-width="6"/>
    
    <!-- X-bracing between levels -->
    <line x1="220" y1="134" x2="268" y2="185" stroke="url(#towerGrad5)" stroke-width="3" opacity="0.7"/>
    <line x1="292" y1="134" x2="244" y2="185" stroke="url(#towerGrad5)" stroke-width="3" opacity="0.7"/>
    
    <line x1="205" y1="189" x2="270" y2="240" stroke="url(#towerGrad5)" stroke-width="3" opacity="0.7"/>
    <line x1="307" y1="189" x2="242" y2="240" stroke="url(#towerGrad5)" stroke-width="3" opacity="0.7"/>
    
    <line x1="190" y1="244" x2="275" y2="295" stroke="url(#towerGrad5)" stroke-width="3" opacity="0.7"/>
    <line x1="322" y1="244" x2="237" y2="295" stroke="url(#towerGrad5)" stroke-width="3" opacity="0.7"/>
  </g>
  
  <!-- Signal waves - left - shifted down 30px -->
  <g filter="url(#glowMain5)">
    <path d="M190,100 Q150,130 190,160" fill="none" stroke="#00d4ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M165,80 Q110,130 165,180" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M140,60 Q70,130 140,200" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>
  
  <!-- Signal waves - right - shifted down 30px -->
  <g filter="url(#glowMain5)">
    <path d="M322,100 Q362,130 322,160" fill="none" stroke="#00d4ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M347,80 Q402,130 347,180" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M372,60 Q442,130 372,200" fill="none" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  </g>
  
  <!-- Glowing NAS text - shifted down 30px -->
  <g filter="url(#textGlow)">
    <text x="256" y="430" 
          font-family="Arial Black, Arial, sans-serif" 
          font-size="120" 
          font-weight="900"
          fill="url(#towerGrad5)" 
          text-anchor="middle"
          letter-spacing="8">NAS</text>
  </g>
  
  <!-- Subtle underline accent - shifted down 30px -->
  <line x1="130" y1="460" x2="382" y2="460" stroke="url(#towerGrad5)" stroke-width="4" stroke-linecap="round" filter="url(#glowMain5)" opacity="0.6"/>
</svg>
